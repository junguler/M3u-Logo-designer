<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M3U Logo Designer</title>
<style>
/* Concrete Signal - shared look for the M3U tool pages. System fonts only, no external requests. */
:root {
  --concrete: #2b2b2b;
  --panel: #1a1a1a;
  --line: #e6e6e6;
  --ink: #000000;
  --text: #ffffff;
  --muted: #bdbdbd;
  --orange: #ff6a1a;
  --pink: #ff4fa3;
  --violet: #a77bff;
  --green: #3ddc84;
  --yellow: #ffd100;
  --red: #ff3b30;
  --blue: #3d8bff;
  --bw: 4px;
  --mono: ui-monospace, Consolas, "Courier New", monospace;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 10px 60px;
  font-family: var(--mono);
  font-size: 14px;
  background: var(--concrete);
  color: var(--text);
}
h1 {
  margin: -20px -20px 18px;
  padding: 8px 14px;
  background: var(--yellow);
  color: var(--ink);
  border-bottom: var(--bw) solid var(--yellow);
  font-size: 1.9em;
  font-weight: 900;
  line-height: 1.25;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  text-align: left;
}
.container {
  position: relative;
  width: 660px;
  max-width: 100%;
  margin: 0 auto;
  padding: 20px;
  background: var(--panel);
  border: var(--bw) solid var(--line);
  box-shadow: 10px 10px 0 var(--ink);
  text-align: left;
}
.input-group { display: flex; align-items: center; gap: 10px; }
textarea, input, select {
  flex-grow: 1;
  min-width: 0;
  margin: 5px 0;
  padding: 10px;
  border: var(--bw) solid var(--line);
  border-radius: 0;
  background: var(--ink);
  color: var(--text);
  font: inherit;
}
input[type='file']::file-selector-button {
  margin-right: 10px;
  padding: 6px 12px;
  border: 3px solid var(--ink);
  border-radius: 0;
  background: var(--orange);
  color: var(--ink);
  font: inherit;
  font-weight: 900;
  -webkit-text-stroke: 0.6px currentColor;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
}
input[type='file']::file-selector-button:hover { filter: brightness(1.1); }
::placeholder { color: var(--muted); opacity: 1; }
textarea { resize: vertical; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
textarea:focus, input:focus, select:focus { border-color: var(--yellow); }

/* Buttons: one colour per role, set through --c */
button {
  --c: var(--orange);
  flex: none;
  width: 130px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 6px;
  border: var(--bw) solid var(--ink);
  border-radius: 0;
  background: var(--c);
  color: var(--ink);
  font: inherit;
  font-size: 0.95em;
  font-weight: 900;
  -webkit-text-stroke: 0.6px currentColor;
  letter-spacing: 0.04em;
  line-height: 1.15;
  text-align: center;
  text-transform: uppercase;
  box-shadow: 3px 3px 0 var(--text);
  cursor: pointer;
}
button:hover { filter: brightness(1.08); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--text); }
button:active { box-shadow: none; transform: translate(3px, 3px); }
button:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; filter: grayscale(0.6); transform: none; }

#fileCheckButton, #fileButton { --c: var(--orange); }
#urlCheckButton, #urlButton { --c: var(--pink); }
#textCheckButton, #textButton { --c: var(--violet); }
.pause-button { display: none; --c: var(--blue); }
.cancel-button { display: none; --c: var(--red); }

#downloadButton {
  display: none;
  width: 260px;
  height: 48px;
  margin: 10px auto;
  --c: var(--green);
}
#downloadReportButton, #downloadDeadButton {
  display: none;
  width: 260px;
  height: 48px;
  margin: 0 auto 10px auto;
  --c: var(--yellow);
}
#viewImagesButton {
  display: none;
  width: 260px;
  height: 48px;
  margin: 0 auto 10px auto;
  --c: var(--line);
}
.download-row { display: flex; flex-direction: column; align-items: center; gap: 5px; }

/* Output area */
.output-wrapper {
  position: relative;
  width: 100%;
  height: 110px;
  min-width: 0;
  min-height: 80px;
  max-width: 100%;
  max-height: 80vh;
  margin: 5px 0 10px 0;
  border: var(--bw) solid var(--line);
  background: var(--ink);
  resize: vertical;
  overflow: auto;
}
.output-wrapper textarea#output {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  min-width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0 10px;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 0.85em;
  resize: none;
  overflow: auto;
  display: block;
}
#summaryLine {
  min-height: 1em;
  margin: 5px 0 10px 0;
  font-size: 0.85em;
  color: var(--muted);
  text-align: left;
}

/* Advanced settings panel */
.advanced-settings {
  margin: 5px 0 10px 0;
  border: var(--bw) solid var(--line);
  background: var(--ink);
  text-align: left;
}
.advanced-settings summary {
  padding: 10px;
  cursor: pointer;
  user-select: none;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.advanced-settings summary:hover { background: #222222; }
.advanced-settings .settings-grid {
  padding: 10px;
  border-top: var(--bw) solid var(--line);
  background: var(--panel);
}
.advanced-settings .settings-grid { display: flex; align-items: center; gap: 25px; }
.settings-column { display: flex; }
.numeric-column { gap: 10px; }
.checkbox-column { flex-direction: column; gap: 8px; }
.advanced-settings .setting-item { display: flex; flex-direction: column; font-size: 0.9em; }
.advanced-settings .setting-item.checkbox-item { flex-direction: row; align-items: center; gap: 6px; }
.advanced-settings input[type='number'] { width: 80px; flex-grow: 0; margin: 3px 0 0 0; padding: 6px; }
.advanced-settings input[type='checkbox'] { flex-grow: 0; width: auto; margin: 0; padding: 0; accent-color: var(--orange); }

.output-wrapper p#currentChecking {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  min-width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 10px;
  border: none;
  background: var(--ink);
  text-align: left;
  white-space: normal;
  overflow: hidden;
  display: none;
}
.output-wrapper p#currentChecking .checking-line {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
@media (max-width: 560px) {
  .input-group { flex-wrap: wrap; }
  .input-group > input, .input-group > textarea { flex: 1 1 100%; }
  .input-group > button { flex: 1 1 90px; width: auto; }
  .settings .input-group { flex-wrap: nowrap; }
  .settings .input-group > select { flex: 1 1 auto; }
}

/* Logo designer additions (layout only, same look) */
.preview { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0; }
#main { width: 320px; max-width: 100%; aspect-ratio: 1; border: var(--bw) solid var(--line); background: var(--ink); }
.side { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
#thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
#thumbs canvas { width: 100%; aspect-ratio: 1; border: 3px solid var(--line); background: var(--ink); }
.advanced-settings .settings-grid.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 16px; align-items: start; }
.advanced-settings .setting-item { min-width: 0; }
.advanced-settings .setting-item input:not([type='checkbox']), .advanced-settings .setting-item select { margin: 3px 0 0 0; padding: 6px; }
.advanced-settings .setting-item input[type='range'] { width: 100%; padding: 0; border: 0; background: none; accent-color: var(--orange); }
.advanced-settings .setting-item input[type='color'] { width: 100%; height: 34px; padding: 0; }
.advanced-settings .setting-item b { color: var(--yellow); }
.advanced-settings .setting-item.checkbox-item input[type='checkbox'] { appearance: auto; flex: none; width: 16px; height: 16px; margin: 0; padding: 0; border: 0; background: transparent; accent-color: var(--orange); cursor: pointer; }
.advanced-settings .setting-item.checkbox-item label { cursor: pointer; }
.mid { display: flex; justify-content: center; }
#rAll { --c: var(--pink); } #rCol { --c: var(--violet); } #rSty { --c: var(--blue); } #rRes { --c: var(--line); }
#lkSave { --c: var(--yellow); } #lkLoad { --c: var(--orange); }
#shAdd { --c: var(--orange); } #shRnd { --c: var(--violet); } #shClr { --c: var(--red); }
#goButton { width: 260px; height: 48px; margin: 10px auto; --c: var(--green); }
#cancelButton { display: none; width: 260px; height: 48px; margin: 0 auto 10px; --c: var(--red); }
</style>
</head>
<body>
<div class="container">
<h1>M3U Logo Designer</h1>

<div class="input-group"><input type="file" id="fileInput" accept=".m3u,.m3u8"><button id="fileButton">Load local file</button></div>
<div class="input-group"><input type="text" id="urlInput" placeholder="Enter online M3U URL..."><button id="urlButton">Load Online Link</button></div>
<div class="input-group"><textarea id="textInput" rows="3" placeholder="Paste M3U content here..."></textarea><button id="textButton">Load Pasted streams</button></div>
<p id="summaryLine">Load a playlist, or just design with the sample names below.</p>

<div class="preview">
<canvas id="main" width="384" height="384"></canvas>
<div class="side"><select id="sample" title="Station shown in the big preview"></select><div id="thumbs"></div></div>
</div>

<div class="input-group">
<button id="rAll">Randomize all</button><button id="rCol">Random colors</button><button id="rSty">Random style</button><button id="rRes">Reset</button>
</div>
<div class="input-group" style="margin-top:10px"><button id="lkSave">Save look</button><button id="lkLoad">Load look</button><input type="file" id="lkFile" accept=".json,application/json" style="display:none"></div>
<div id="panels" style="margin-top:10px"></div>

<div class="output-wrapper"><textarea id="output" readonly placeholder="The updated playlist appears here after generating."></textarea></div>
<div class="mid"><button id="goButton">Generate ZIP</button></div>
<div class="mid"><button id="cancelButton">Cancel</button></div>
<a id="dl" style="display:none"></a>
</div>

  if (c.ty === 'r') $('o_' + c.id).textContent = V[c.id];
  upd();
});

let parsed = null, srcName = 'playlist.m3u', titles = DEMO.slice(), raf;
const upd = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(paint); };
function paint() {
  keepLast();
  const t = $('sample').value || titles[0];
  draw($('main'), t, opts(t));
  [...$('thumbs').children].forEach((cv, i) => draw(cv, titles[i], opts(titles[i])));
}
function setTitles(list) {
  titles = list.length ? list : DEMO.slice();
  $('sample').innerHTML = titles.slice(0, 400).map((t) => `<option>${t.replace(/</g, '&lt;')}</option>`).join('');
  $('thumbs').innerHTML = '';
  for (let i = 0; i < 6; i++) { const cv = document.createElement('canvas'); cv.width = cv.height = 128; cv.title = titles[i % titles.length]; if (i >= titles.length) titles.push(DEMO[i]); $('thumbs').appendChild(cv); }
  upd();
}
const rnd = (scope) => { randomize(V, scope, Math.random, V.rp); sync(); upd(); };
$('rAll').onclick = () => rnd('all'); $('rCol').onclick = () => rnd('colors'); $('rSty').onclick = () => rnd('style');
$('rRes').onclick = () => { ALL.forEach((c) => (V[c.id] = c.def)); V.shapes = []; listShapes(); sync(); upd(); };
$('sample').onchange = upd;

/* ---------- save / load looks ---------- */
const LK = 'm3u-logo-designer-look';
const OUT = ['useurl', 'urlpre', 'pre'];
function lookData() { const st = {}; ALL.forEach((c) => (st[c.id] = V[c.id])); return { app: 'm3u-logo-designer', version: 1, settings: st, shapes: V.shapes }; }
function applyLook(d, keepOut) {
  if (!d || typeof d !== 'object' || !d.settings) throw Error('Not a look file.');
  ALL.forEach((c) => {
    const v = d.settings[c.id]; if (v === undefined || (keepOut && OUT.includes(c.id))) return;
    if (c.ty === 'r' && typeof v === 'number') V[c.id] = Math.min(c.b, Math.max(c.a, v));
    else if (c.ty === 's' && c.a.includes(v)) V[c.id] = v;
    else if (c.ty === 'c' && /^#[0-9a-f]{6}$/i.test(v)) V[c.id] = v;
    else if (c.ty === 'k' && typeof v === 'boolean') V[c.id] = v;
    else if (c.ty === 't' && typeof v === 'string') V[c.id] = v;
  });
  const n = (v) => typeof v === 'number' && isFinite(v);
  V.shapes = (Array.isArray(d.shapes) ? d.shapes : []).filter((s) => s && SHT.includes(s.t) && /^#[0-9a-f]{6}$/i.test(s.col) && [s.sz, s.x, s.y, s.rot, s.op, s.lw].every(n)).map((s) => ({ t: s.t, col: s.col, sz: s.sz, x: s.x, y: s.y, rot: s.rot, op: s.op, fill: s.fill === 'outline' ? 'outline' : 'filled', lw: s.lw, over: !!s.over }));
  listShapes(); sync(); upd();
}
$('lkSave').onclick = () => { const a = $('dl'); if (a.href.startsWith('blob:')) URL.revokeObjectURL(a.href); a.href = URL.createObjectURL(new Blob([JSON.stringify(lookData(), null, 2)], { type: 'application/json' })); a.download = 'm3u-logo-look.json'; a.click(); };
$('lkLoad').onclick = () => $('lkFile').click();
$('lkFile').onchange = async (e) => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { applyLook(JSON.parse(await f.text()), true); $('summaryLine').textContent = `Loaded look "${f.name}" (output folder and URL prefix were kept as they are).`; } catch (er) { alert('Could not load look: ' + er.message); } };
const keepLast = () => { try { localStorage.setItem(LK, JSON.stringify(lookData())); } catch (e) { /* storage unavailable */ } };

/* ---------- M3U parsing (same logic as the sibling tools) ---------- */
function splitTitle(line) { let q = false; for (let i = 0; i < line.length; i++) { const ch = line[i]; if (ch === '"') q = !q; else if (ch === ',' && !q) return line.slice(i + 1).trim(); } return ''; }
function parseM3U(text) {
  const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).map((l) => l.trim());
  let extm3u = '#EXTM3U', saw = false, pe = null, px = [];
  const header = [], entries = [], flush = (u) => { entries.push({ extinf: pe, extra: px, url: u }); pe = null; px = []; };
  for (const l of lines) {
    if (!l) continue;
    if (/^#EXTM3U/i.test(l)) { if (!saw) extm3u = l; continue; }
    saw = true;
    if (/^#EXTINF/i.test(l)) { if (pe) flush(null); pe = l; continue; }
    if (l[0] === '#') { (!entries.length && !pe ? header : px).push(l); continue; }
    flush(l);
  }
  if (pe) flush(null);
  entries.forEach((e) => (e.title = e.extinf ? splitTitle(e.extinf) : ''));
  return { extm3u, header, entries };
}
const renderEntry = (e, ov) => [...(e.extinf ? [ov || e.extinf] : []), ...e.extra, ...(e.url ? [e.url] : [])];
const withLogo = (ext, p) => { const a = `tvg-logo="${p}"`; return /tvg-logo\s*=\s*"[^"]*"/i.test(ext) ? ext.replace(/tvg-logo\s*=\s*"[^"]*"/i, a) : ext.replace(/^(#EXTINF:\s*-?[\d.]+)/i, `$1 ${a}`); };

function load(text, name) {
  parsed = parseM3U(text); srcName = name;
  const list = [...new Set(parsed.entries.filter((e) => e.title).map((e) => e.title))];
  setTitles(list);
  const missing = parsed.entries.filter((e) => e.title && !/tvg-logo\s*=\s*"[^"]+"/i.test(e.extinf)).length;
  $('summaryLine').textContent = `Loaded ${parsed.entries.length} entries, ${list.length} unique titles, ${missing} without a logo.`;
}
$('fileButton').onclick = async () => { const f = $('fileInput').files[0]; if (!f) return alert('Please upload an M3U file.'); load(await f.text(), f.name); };
$('textButton').onclick = () => { const t = $('textInput').value; if (!t.trim()) return alert('Please paste M3U content.'); load(t, 'pasted_streams.m3u'); };
$('urlButton').onclick = async () => {
  let u = $('urlInput').value.trim(); if (!u) return alert('Please enter an online M3U URL.');
  try {
    const x = new URL(u);
    if (x.hostname === 'github.com') { const p = x.pathname.split('/').filter(Boolean); if (p.length >= 5 && p[2] === 'raw') { const [o, r, , ...rest] = p; u = `https://raw.githubusercontent.com/${o}/${r}/${rest.join('/')}`; } }
    const res = await fetch(u, { cache: 'no-store' }); if (!res.ok) throw Error('HTTP ' + res.status);
    const t = await res.text(); if (!/#EXT(M3U|INF)/i.test(t)) throw Error('Not an M3U playlist.');
    load(t, decodeURIComponent(x.pathname.split('/').pop() || 'playlist.m3u'));
  } catch (e) { alert(`Error fetching online M3U file: ${e.message} (the server may block browser CORS requests)`); }
};

/* ---------- ZIP (store, no compression, no dependencies) ---------- */
const crcT = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc = (u) => { let c = -1; for (let i = 0; i < u.length; i++) c = crcT[(c ^ u[i]) & 255] ^ (c >>> 8); return ~c >>> 0; };
function zip(files) {
  const enc = new TextEncoder(), parts = [], cd = [], D = new Date();
  const dt = (D.getHours() << 11) | (D.getMinutes() << 5) | (D.getSeconds() >> 1), dd = ((D.getFullYear() - 1980) << 9) | ((D.getMonth() + 1) << 5) | D.getDate();
  let off = 0;
  for (const f of files) {
    const nm = enc.encode(f.name), c = crc(f.data), n = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x800, true); h.setUint16(10, dt, true); h.setUint16(12, dd, true); h.setUint32(14, c, true); h.setUint32(18, n, true); h.setUint32(22, n, true); h.setUint16(26, nm.length, true);
    parts.push(h.buffer, nm, f.data);
    const e = new DataView(new ArrayBuffer(46));
    e.setUint32(0, 0x02014b50, true); e.setUint16(4, 20, true); e.setUint16(6, 20, true); e.setUint16(8, 0x800, true); e.setUint16(12, dt, true); e.setUint16(14, dd, true); e.setUint32(16, c, true); e.setUint32(20, n, true); e.setUint32(24, n, true); e.setUint16(28, nm.length, true); e.setUint32(42, off, true);
    cd.push(e.buffer, nm); off += 30 + nm.length + n;
  }
  let cs = 0; cd.forEach((b) => (cs += b.byteLength));
  const z = new DataView(new ArrayBuffer(22));
  z.setUint32(0, 0x06054b50, true); z.setUint16(8, files.length, true); z.setUint16(10, files.length, true); z.setUint32(12, cs, true); z.setUint32(16, off, true);
  return new Blob([...parts, ...cd, z.buffer], { type: 'application/zip' });
}

/* ---------- generate ---------- */
let cancel = false;
const slug = (t) => t.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
$('cancelButton').onclick = () => (cancel = true);
$('goButton').onclick = async () => {
  if (!parsed || !parsed.entries.length) return alert('Load a playlist first.');
  cancel = false; $('goButton').disabled = true; $('cancelButton').style.display = 'flex'; $('output').value = '';
  const N = +V.size, cv = document.createElement('canvas'); cv.width = cv.height = N;
  const pre = V.pre.trim().replace(/^\.?\/+/, '').replace(/\/*$/, '/').replace(/^\/$/, '');
  const files = [], map = new Map(), used = new Set(), lines = [parsed.extm3u, ...parsed.header], enc = new TextEncoder();
  const lp = V.useurl ? V.urlpre.trim().replace(/\/*$/, '/') : pre;
  const todo = parsed.entries.filter((e) => e.title && (V.ow || !/tvg-logo\s*=\s*"[^"]+"/i.test(e.extinf))).length;
  let done = 0, made = 0;
  for (const e of parsed.entries) {
    if (cancel) break;
    const need = e.title && (V.ow || !/tvg-logo\s*=\s*"[^"]+"/i.test(e.extinf));
    if (!need) { lines.push(...renderEntry(e)); continue; }
    let fn = map.get(e.title);
    if (!fn) {
      const hs = hash(e.title).toString(36), sl = slug(e.title);
      let n = V.plain ? (sl || 'station-' + hs) : (sl ? `${sl}-${hs.slice(0, 5)}` : 'station-' + hs), i = 2; const b = n;
      while (used.has(n)) n = `${b}-${i++}`;
      used.add(n); fn = n + '.jpg';
      draw(cv, e.title, opts(e.title));
      const blob = await new Promise((r) => cv.toBlob(r, 'image/jpeg', V.q / 100));
      files.push({ name: pre + fn, data: new Uint8Array(await blob.arrayBuffer()) });
      map.set(e.title, fn); made++;
    }
    lines.push(...renderEntry(e, withLogo(e.extinf, lp + fn)));
    done++;
    if (done % 4 === 0) { $('summaryLine').textContent = `Designing logo ${done} of ${todo}: ${e.title}`; await new Promise((r) => setTimeout(r)); }
  }
  $('goButton').disabled = false; $('cancelButton').style.display = 'none';
  if (cancel) { $('summaryLine').textContent = 'Cancelled. Nothing was downloaded.'; return; }
  const m3u = lines.join('\n') + '\n', stem = srcName.replace(/\.m3u8?$/i, ''), ext = (/\.(m3u8?)$/i.exec(srcName) || [0, 'm3u'])[1].toLowerCase();
  files.unshift({ name: `${stem}_logos.${ext}`, data: enc.encode(m3u) });
  $('output').value = m3u;
  const a = $('dl'); if (a.href.startsWith('blob:')) URL.revokeObjectURL(a.href);
  a.href = URL.createObjectURL(zip(files)); a.download = `${stem}_logos.zip`; a.click();
  $('summaryLine').textContent = `Done: ${made} images, ${done} entries updated. ${V.useurl ? ` tvg-logo points to ${lp}, so upload the "${pre || './'}" folder there.` : ` Unzip and keep "${stem}_logos.${ext}" next to its "${pre || './'}" folder.`}`;
};

try { const d = JSON.parse(localStorage.getItem(LK)); if (d) applyLook(d, false); } catch (e) { /* no saved look */ }
sync(); setTitles(DEMO.slice());
})();
</script>
</body>
</html>
